name: Release build

# Never runs on its own. Press "Run workflow" in the Actions tab,
# then download the zips from the run's artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update Rust
        run: rustup update stable --no-self-update

      - name: Build and zip all plugins
        run: python bundle.py --all

      - uses: actions/upload-artifact@v6
        with:
          name: sacria-win64
          path: dist/*.zip
          if-no-files-found: error
